<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="/ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #111111;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .error-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }
        .error-code {
            font-size: 100px;
            font-weight: 700;
            color: #5a0096;
            line-height: 1;
            text-shadow: 0 0 20px rgba(90, 0, 150, 0.4);
        }
        .error-text {
            font-size: 22px;
            font-weight: 400;
            color: #a0a0a0;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #111111;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 0 24px;
        }
        .nav-container {
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
        }
        .logo img {
            width: 30px;
            height: auto;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            margin: 0 auto;
        }
        .nav-links a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
      @media(max-width:720px) {
            .nav-container {
                justify-content: center;
            }
            .logo {
                display: none;
            }
            .nav-links {
                margin: 0;
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <div class="error-text">Page not found</div>
</div>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="ametium.png" alt="Ametium Logo">
        </div>
        <div class="nav-links">
            <a href="home">Home</a>
            <a href="features">Features</a>
            <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
        </div>
    </div>
</nav>
</body>
</html>
