<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ametium Development</title>
    <link href="/ametium.png" rel="icon" type="image/png"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; background: #111111; color: white; font-family: 'Poppins', sans-serif; overflow: hidden; }
        
        /* Navbar */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: #111111; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; padding: 0 40px; z-index: 1000; }
        .nav-container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; }
        .logo img { width: 30px; height: auto; display: block; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: #a0a0a0; font-size: 13px; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: #ffffff; }

        /* Error 404 */
        .error-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .error-code { font-size: 80px; font-weight: 200; color: #ffffff; line-height: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .error-text { font-size: 18px; font-weight: 300; color: #a0a0a0; margin-top: 10px; letter-spacing: 1px; }

        @media(max-width:720px) {
            .navbar { padding: 0 20px; }
            .logo { display: none; }
            .nav-container { justify-content: center; }
            .nav-links { gap: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="/ametium.png" alt="Ametium Logo">
            </div>
            <div class="nav-links">
                <a href="../home">Home</a>
                <a href="../features">Features</a>
                <a href="../updates">Updates</a>
                <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
            </div>
            <div style="width: 30px;"></div>
        </div>
    </nav>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-text">Page not found</div>
    </div>

</body>
</html>
