<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ametium Development</title>
    <link href="/ametium.png" rel="icon" type="image/png"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #111111; color: white; font-family: 'Poppins', sans-serif; overflow: hidden; width: 100%; height: 100%; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: #111111; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; padding: 0 24px; z-index: 1000; }
        .nav-container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; position: relative; }
        .logo { position: absolute; left: 0; display: flex; align-items: center; }
        .logo img { width: 30px; height: auto; }
        .nav-links { display: flex; gap: 28px; margin: 0 auto; }
        .nav-links a { text-decoration: none; color: #a0a0a0; font-size: 13px; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: #ffffff; }
        .error-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .error-code { font-size: 120px; font-weight: 700; color: #ffffff; line-height: 1; }
        .error-text { font-size: 20px; color: #666; margin-top: 10px; }
        @media(max-width:720px) {
            .navbar { padding: 0 24px; }
            .logo { display: none; }
            .nav-container { justify-content: center; }
            .nav-links { gap: 16px; margin: 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="../ametium.png" alt="Ametium Logo">
            </div>
            <div class="nav-links">
                <a href="../home">Home</a>
                <a href="../features">Features</a>
                <a href="../updates">Updates</a>
                <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
            </div>
        </div>
    </nav>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-text">PAGE NOT FOUND</div>
    </div>
</body>
</html>
