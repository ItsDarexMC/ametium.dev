    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: { DEFAULT: '#5A0096', foreground: '#ffffff' },

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.08); }
        }
        @keyframes blob-breathe {
            0%   { transform: scale(1) translate(0, 0); }
            50%  { transform: scale(1.08) translate(15px, 20px); }
            100% { transform: scale(0.95) translate(-10px, -15px); }
        }
        @keyframes grid-fade {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.15; }
        }
        .noise-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat; background-size: 256px 256px; pointer-events: none;
        }
        .aurora-layer {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
        }
        .aurora-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(90,0,150,0.28) 0%, transparent 70%);
            top: -200px; left: -100px;
            animation: blob-breathe 12s infinite alternate ease-in-out;
        }
        .aurora-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(124,0,200,0.2) 0%, transparent 70%);
            bottom: -150px; right: -100px;
            animation: blob-breathe 16s infinite alternate-reverse ease-in-out;
        }
        .aurora-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(90,0,150,0.15) 0%, transparent 70%);
            top: 40%; left: 50%;
            animation: blob-breathe 20s infinite alternate ease-in-out;
            animation-delay: 4s;
        }
        @media (max-width: 768px) {
            .aurora-1 { width: 250px; height: 250px; top: -120px; left: -80px; opacity: 0.4; }
            .aurora-2 { width: 200px; height: 200px; bottom: -100px; right: -60px; opacity: 0.4; }
            .aurora-3 { width: 180px; height: 180px; opacity: 0.3; }
        }
        .grid-bg {
            background-image:
                    linear-gradient(rgba(90,0,150,0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(90,0,150,0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid-fade 8s ease-in-out infinite;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 70%);
        }
        .hero-glow { position: relative; }
        .hero-glow::before {
            content: ''; position: absolute; inset: -60px;
            background: radial-gradient(circle, rgba(90,0,150,0.4) 0%, transparent 70%);
            animation: glow-pulse 4s ease-in-out infinite;
            z-index: -1; filter: blur(50px);
        }
        .hero-glow::after {
            content: ''; position: absolute; inset: -80px;
            background: radial-gradient(circle, rgba(124,0,200,0.2) 0%, transparent 60%);
            animation: glow-pulse 6s ease-in-out infinite;
            animation-delay: 1s; z-index: -1; filter: blur(70px);
        }
        .hover-lift {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -8px rgba(90,0,150,0.4);
        }
        .glass-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
            transition: padding 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.4s ease, background 0.4s ease;
        }
        .glass-card.scrolled {
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        @media (max-width: 768px) { .glass-card { left: 8px; right: 8px; } }
        .glass-row {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .glass-row:hover {
            border-color: rgba(90,0,150,0.5);
            background: rgba(255,255,255,0.08);
        }
        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(90,0,150,0.4);
            background: rgba(255,255,255,0.07);
        }
    </style>
</head>

<script>
    const island = document.getElementById('dynamic-island');
    if (island) {
        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) island.classList.add('scrolled');
            else island.classList.remove('scrolled');
        }, { passive: true });
    }

    async function updateDiscordStats() {
        try {
            const res = await fetch('https://discord.com/api/v9/invites/ametium?with_counts=true');
            const data = await res.json();
            document.getElementById('total-members').textContent = data.approximate_member_count.toLocaleString();
            document.getElementById('online-members').textContent = data.approximate_presence_count.toLocaleString();
        } catch(e) {}
    }
    updateDiscordStats();
    setInterval(updateDiscordStats, 60000);
</script>
