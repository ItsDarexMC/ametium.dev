<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #111111;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .logo img {
            width: 30px;
            height: auto;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .hero {
            width: 100%;
            padding-top: 64px;
        }

        .hero-container {
            width: 100%;
        }

        .hero-video {
            width: 100%;
            height: 45vh;
            min-height: 460px;
            overflow: hidden;
            position: relative;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: 0;
            vertical-align: bottom;
            filter: blur(4px);
        }

        .hero-grid-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
        }

        .hero-content {
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 24px;
        }

        .hero-title-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hero-title {
            font-size: 46px;
            font-weight: 700;
            line-height: 1.2;
        }

        .hero-description {
            color: rgba(255,255,255,0.72);
            font-size: 16px;
            line-height: 1.4;
            max-width: 620px;
        }

        .hero-actions-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
        }

        .discord-btn-container {
            display: inline-block;
        }

        .discord-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px;
            background: #5a0096;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .discord-btn:hover {
            background: #4a007a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(90, 0, 150, 0.35);
        }

        .discord-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .hero-stats-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            line-height: 1;
            color: #ffffff;
        }

        .download-section {
            width: 100%;
            max-width: 1500px;
            margin: auto;
            padding: 60px 40px 20px 40px;
            text-align: center;
        }

        .section-heading {
            font-size: 28px;
            font-weight: 300;
            text-align: center;
            margin-bottom: 32px;
            color: rgba(255, 255, 255, 0.5);
        }

        .download-links-list {
            display: flex;
            flex-direction: row;
            gap: 36px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .download-archive-link {
            font-size: 22px;
            font-weight: 500;
            color: #fafafa;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-block;
            line-height: 1.2;
        }

        .download-archive-link:hover {
            color: rgba(150, 150, 150, 0.7);
        }

        .info-section {
            width: 100%;
            max-width: 1500px;
            margin: auto;
            padding: 40px 40px 80px 40px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .info-card {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 28px;
        }

        .info-title {
            font-size: 20px;
            font-weight: 600;
        }

        .info-text {
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.68);
            line-height: 1.8;
            font-size: 14px;
        }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
        }

        @media(max-width:960px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:720px) {
            .hero-video {
                height: auto;
                min-height: 460px;
                padding: 0;
            }

            .hero-grid-wrapper {
                grid-template-columns: 1fr;
                padding: 0 24px;
            }

            .hero-content {
                align-items: flex-start;
                text-align: left;
                gap: 24px;
                transform: none;
            }

            .hero-title {
                font-size: 46px;
            }

            .hero-description {
                font-size: 16px;
            }

            .hero-actions-container {
                align-items: flex-start;
                gap: 20px;
            }
