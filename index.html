<!DOCTYPE html>

<head>

    <title>ametium.dev</title>
    <link rel="icon" type="image/png" href="ametium.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: { DEFAULT: '#5A0096', foreground: '#ffffff' },

    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.08); }
        }
        @keyframes grid-fade {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.15; }
        }
        .noise-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat; background-size: 256px 256px; pointer-events: none;
        }
        .grid-bg {
            background-image:
                    linear-gradient(rgba(90,0,150,0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(90,0,150,0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid-fade 8s ease-in-out infinite;
        }
        .hero-glow { position: relative; }
        .hero-glow::before {
            content: ''; position: absolute; inset: -60px;
            background: radial-gradient(circle, rgba(90,0,150,0.4) 0%, transparent 70%);
            animation: glow-pulse 4s ease-in-out infinite;
            z-index: -1; filter: blur(50px);
        }
        .hero-glow::after {
            content: ''; position: absolute; inset: -80px;
            background: radial-gradient(circle, rgba(124,0,200,0.2) 0%, transparent 60%);
            animation: glow-pulse 6s ease-in-out infinite;
            animation-delay: 1s; z-index: -1; filter: blur(70px);
        }
        .hover-lift {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -8px rgba(90,0,150,0.4);
        }

        :root { --bar-h: 70px; }
        body { position: relative; min-height: 100vh; }
        .orb-dot, .orb-blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: glow-pulse 6s ease-in-out infinite;
        }

        /* One purple background covering the whole page, from the very top to the very bottom */
        .page-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        /* The solid top bar carries an identical, full-page copy that follows the scroll, so it always shows the exact part of the design behind it */
        .top-bar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--page-h, 100vh);
            pointer-events: none;
            will-change: transform;
        }
        .top-bar-logo, .top-bar-links { position: relative; z-index: 1; }
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            height: var(--bar-h);
            background: #0d0d0d;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
        }
        .top-bar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .top-bar-logo img {
            width: 28px;
            height: 28px;
            border-radius: 5px;
        }
        .top-bar-logo span {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.02em;
        }
        .top-bar-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 7px;
            color: rgba(255,255,255,0.6);
        }

        .hero-section {
            width: 100%;
            min-height: 54vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            outline: 1px solid rgba(255,255,255,0.14);
            margin-top: var(--bar-h);
        }
        @media (min-width: 1024px) {
            .hero-section { min-height: 480px; }
        }

        .section-wrapper { width: 100%; padding: 70px 20px; position: relative; z-index: 10; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 10px; }
        .discord-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-top: 100px;
            margin-bottom: 10px;
        }
        .discord-info { display: flex; align-items: center; gap: 20px; min-width: 0; }
        .discord-info img { width: 60px; height: 60px; border-radius: 12px; flex-shrink: 0; }
        .discord-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discord-text h3 { font-size: 20px; font-weight: 600; color: #fff; }
        .discord-stats { display: flex; gap: 15px; margin-top: 8px; color: rgba(255,255,255,0.6); font-size: 14px; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .join-btn {
            background: #5a0096;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }
        .join-btn:hover { opacity: 0.9; }

        .footer-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
        }
        .footer {
            position: relative;
            z-index: 10;
            padding: 32px 20px 40px;
            text-align: left;
            max-width: 900px;
            margin: 0 auto;
        }
        .footer-line {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin-bottom: 16px;
        }
        .footer-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        @media(max-width:720px) {
            :root { --bar-h: 60px; }
            .top-bar {
                padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
            }
            .section-wrapper { padding: 24px 20px; }
            .discord-section {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
                padding: 24px;
                border-radius: 14px;
                margin-top: 48px;
            }
            .discord-info { gap: 14px; text-align: left; }
            .discord-info img { width: 48px; height: 48px; border-radius: 10px; }
            .discord-text { white-space: normal; }
            .discord-text h3 { font-size: 17px; }
            .discord-stats { justify-content: flex-start; gap: 12px; font-size: 13px; }
            .join-btn { width: 100%; text-align: center; padding: 13px 24px; }
            .footer { padding: 24px 20px 32px; }
        }
    </style>
</head>

<script>
    async function updateDiscordStats() {
        try {
            const res = await fetch('https://discord.com/api/v9/invites/ametium?with_counts=true');
            const data = await res.json();
            document.getElementById('total-members').textContent = data.approximate_member_count.toLocaleString();
            document.getElementById('online-members').textContent = data.approximate_presence_count.toLocaleString();
        } catch(e) {}
    }
    updateDiscordStats();
    setInterval(updateDiscordStats, 60000);
</script>
<script>
    (function () {
        var barBg = document.querySelector('.top-bar-bg');
        var root = document.documentElement;
        var ticking = false;
        function size() {
            root.style.setProperty('--page-h', Math.max(root.scrollHeight, document.body.scrollHeight) + 'px');
        }
        function move() {
            barBg.style.transform = 'translate3d(0,' + (-(window.pageYOffset || 0)) + 'px,0)';
            ticking = false;
        }
        function onScroll() {
            if (!ticking) { ticking = true; requestAnimationFrame(move); }
        }
        size(); move();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', function () { size(); move(); });
        window.addEventListener('load', function () { size(); move(); });
        if ('ResizeObserver' in window) new ResizeObserver(function () { size(); move(); }).observe(document.body);
    })();
</script>
