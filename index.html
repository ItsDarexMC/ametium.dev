<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>

    <link rel="icon" type="image/png" href="ametiumlogo.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            background: #000000;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.7s ease forwards;
            width: 100%;
            max-width: 520px;
            padding: 25px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            text-shadow:
                0 0 5px rgba(255,255,255,0.6),
                0 0 10px rgba(255,255,255,0.4);
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 15px;
            text-align: center;
            line-height: 1.7;
            max-width: 420px;
        }

        .authors {
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            color: white;
            display: block;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .discord-stats-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .discord-stats-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .discord {
            background: #5a0096;
        }

        .discord:hover {
            box-shadow: 0 0 12px #5a0096;
            transform: translateY(-2px);
        }

        .social-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 25px;
            width: 100%;
        }

        .social-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .icons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .icons a {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .icons a:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .icons img {
            width: 16px;
            filter: brightness(0) invert(1) drop-shadow(0 0 3px #ffffff);
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            opacity: 0.4;
            text-align: center;
        }

        #category-panel {
            position: absolute;
            left: calc(45% - 410px);
            top: calc(35% - 240px);
            z-index: 2;
        }

        #category-panel img {
            width: 100px;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }

        #logo-panel {
            position: absolute;
            left: calc(48% + 150px);
            top: calc(43% - 230px);
            z-index: 2;
        }

        #logo-panel img {
            width: 125px;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }

        @media (max-width: 900px) {
            #category-panel {
                position: relative;
                left: auto;
                top: auto;
                margin-bottom: 20px;
            }
            #logo-panel {
                position: relative;
                left: auto;
                top: auto;
                margin-top: 20px;
            }
        }

        @media (max-width: 600px) {

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 13px;
            }

            .btn {
                font-size: 13px;
            }

            .social-container {
                gap: 10px;
            }

            #category-panel img {
                width: 110px;
            }

            #logo-panel img {
                width: 35px;
            }
        }
    </style>
</head>

<body>

<canvas id="particles-canvas"></canvas>

<div class="card">

    <div class="title">
        Ametium Development
    </div>

    <div class="subtitle">
        Únete al Discord oficial para descargar Ametium Addon,
        recibir soporte y actualizaciones.
    </div>

    <div class="authors">
        By ItsDarexMC
    </div>

    <div class="buttons">

        <div class="btn discord-stats-btn">
            <span style="display:flex; align-items:center; justify-content:center; gap:8px;">

                <span style="display:flex; align-items:center; gap:5px;">
                    <span style="width:6px;height:6px;background:#43b581;border-radius:50%;box-shadow:0 0 6px #43b581;"></span>
                    <span id="discord-online">0</span> Online
                </span>

                <span style="opacity:0.5;">•</span>

                <span style="display:flex; align-items:center; gap:5px;">
                    <span style="width:6px;height:6px;background:#b0b3b8;border-radius:50%;box-shadow:0 0 6px #b0b3b8;"></span>
                    <span id="discord-total">0</span> Miembros
                </span>

            </span>
        </div>

        <a href="https://discord.gg/4Wbk2x7qXn" class="btn discord" target="_blank">
            Unirse al Discord Oficial
        </a>

    </div>

    <div class="social-container">
        <div class="social-group">

            <div class="icons">

                <a href="https://www.tiktok.com/@Ametium" target="_blank">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/tiktok.svg">
                </a>

                <a href="https://www.youtube.com/@Ametium" target="_blank">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg">
                </a>

                <a href="https://github.com/ItsDarexMC" target="_blank">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg">
                </a>

                <a href="https://www.youtube.com/@ItsDarexMC" target="_blank">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg">
                </a>

                <a href="https://www.tiktok.com/@ItsDarexMC" target="_blank">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/tiktok.svg">
                </a>

            </div>
        </div>
    </div>

</div>

<div id="category-panel">
    <img id="category-img" src="ametium.png">
</div>

<div id="logo-panel">
    <img id="logo-img" src="ametiumlogo.png">
</div>

<div class="footer">
    © 2026 Ametium Development. All rights reserved.
</div>

<script>
    (function() {

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let w, h, particles;

        function getParticleCount() {
            return Math.floor((window.innerWidth * window.innerHeight) / 7000);
        }

        const config = {
            color: '#8a2be2',
            connectDist: 150,
            maxVelocity: 0.2
        };

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < getParticleCount(); i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * config.maxVelocity,
                    vy: (Math.random() - 0.5) * config.maxVelocity,
                    radius: 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                p1.x += p1.vx;
                p1.y += p1.vy;

                if (p1.x < 0 || p1.x > w) p1.vx *= -1;
                if (p1.y < 0 || p1.y > h) p1.vy *= -1;

                ctx.fillStyle = config.color;
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];

                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;

                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < config.connectDist) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = config.color;
                        ctx.lineWidth = 0.6;
                        ctx.globalAlpha = 1 - (dist / config.connectDist);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        draw();

    })();

    (function() {

        const panel = document.getElementById('category-panel');
        const img = document.getElementById('category-img');

        let dragging = false;
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        panel.addEventListener('mousedown', function(e) {
            dragging = true;
            isDragging = false;

            const rect = panel.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
        });

        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            isDragging = true;
            panel.style.left = (e.clientX - offsetX) + 'px';
            panel.style.top = (e.clientY - offsetY) + 'px';
            panel.style.right = 'auto';
        });

        document.addEventListener('mouseup', function() {
            dragging = false;
        });

        panel.addEventListener('click', function() {
            if (isDragging) return;

            if (img.src.includes('ametium.png')) {
                img.src = 'closed.png';
            } else {
                img.src = 'ametium.png';
            }
        });

    })();

    (function() {

    const inviteCode = '4Wbk2x7qXn';

    async function updateStats() {

        try {

            const response = await fetch(
                `https://discord.com/api/v9/invites/${inviteCode}?with_counts=true`
            );

            const data = await response.json();

            if (data.approximate_presence_count !== undefined) {
                document.getElementById('discord-online').innerText =
                    data.approximate_presence_count;
            }

            if (data.approximate_member_count !== undefined) {
                document.getElementById('discord-total').innerText =
                    data.approximate_member_count;
            }

        } catch (e) {}

    }

    updateStats();
    setInterval(updateStats, 60000);

})();
</script>

</body>
</html>
