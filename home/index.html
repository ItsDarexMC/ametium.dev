<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ametium Development</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111111; color: white; font-family: sans-serif; overflow-x: hidden; }
        
        .hero-image {
            width: 100%;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Esto fuerza a rellenar todo el espacio sin deformar */
            z-index: 0;
        }

        .hero-grid-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
        }

        @media(max-width:720px) {
            .hero-image {
                height: 100vh; /* Mantiene la altura total en móvil */
            }
            /* Aseguramos que el video siga cubriendo todo en móvil */
            .bg-image {
                object-fit: cover; 
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-image">
            <video class="bg-image" autoplay muted loop playsinline>
                <source src="/video.mp4" type="video/mp4">
            </video>
            <div class="hero-grid-wrapper">
                <div class="hero-content">
                    <h1>Ametium Utility Mod</h1>
                    <p>An addon for Meteor Client.</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
