<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <style>
        /* ... (tus estilos anteriores) ... */
        
        .hero-image {
            width: 100%;
            height: 500px; /* Define aquí la altura exacta que quieras que tenga el contenedor */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center; 
            z-index: 0;
            filter: blur(8px);
        }

        @media(max-width:720px) {
            .hero-image {
                height: 450px; /* Ajusta este valor para el tamaño deseado en móvil */
            }
            .bg-image {
                /* Forzamos cover también en móvil para evitar los espacios negros */
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-image">
            <video class="bg-image" autoplay muted loop playsinline>
                <source src="/video.mp4" type="video/mp4">
            </video>
            </div>
    </section>
</body>
</html>
