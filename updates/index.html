<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="/ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; background: #111111; color: #e0e0e0; font-family: 'Poppins', sans-serif; overflow: hidden; }
      .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: #111111; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 0 24px; }
        .logo { position: absolute; left: 40px; display: flex; align-items: center; }
        .logo img { width: 30px; height: auto; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: #a0a0a0; font-size: 13px; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: #ffffff; }
        .main-wrapper { width: 100%; height: 100%; padding-top: 64px; overflow-y: auto; }
        .updates-section { width: 100%; max-width: 1200px; margin: auto; padding: 60px 40px; }
        .updates-title { font-size: 42px; font-weight: 700; color: #ffffff; }
        .update-box { background: #161616; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; margin-top: 40px; position: relative; }
        .update-header { padding: 24px; font-size: 24px; font-weight: 700; color: #ffffff; cursor: default; display: flex; justify-content: space-between; align-items: center; }
        .update-inner { padding: 24px; border-top: 1px solid rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); line-height: 1.8; font-size: 12px; }
        .footer { border-top: 1px solid rgba(255,255,255,0.05); padding: 40px; text-align: center; color: rgba(255,255,255,0.45); font-size: 13px; }
        .changelog { font-family: inherit; white-space: pre-wrap; word-break: break-word; }
        .plus, .plus-group { color: #00cc52; font-weight: 600; }
        .minus, .minus-group { color: #ff3b3b; font-weight: 600; }
        .warn, .warn-group { color: #4da3ff; font-weight: 600; }
        .lang-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        @media(max-width: 720px) {
        .navbar { height: auto; padding: 15px 24px; }
            .logo { display: none; }
            .nav-links { gap: 15px; }
            .main-wrapper { padding-top: 120px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="/ametium.png" alt="Ametium Logo"></div>
        <div class="nav-links">
            <a href="../home">Home</a>
            <a href="../features">Features</a>
            <a href="../updates" style="color: #ffffff;">Updates</a>
            <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
        </div>
    </nav>
    <div class="main-wrapper">
        <section class="updates-section">
            <div class="updates-title" id="page-title">Changelogs</div>
            <div class="update-box">
                <div class="update-header">
                    <span>3.3</span>
                    <button class="lang-btn" onclick="toggleLanguage()">
                        <img id="lang-flag" src="https://flagcdn.com/w20/es.png" alt="Flag">
                        <span id="lang-text">Español</span>
                    </button>
                </div>
                <div class="update-inner"><pre class="changelog" id="log-3.3"></pre></div>
            </div>
        </section>
        <div class="footer" id="page-footer">© 2026 Ametium Development. Todos los derechos reservados.</div>
    </div>
    <script>
        let currentLang = 'en';
        const translations = {
            en: { title: "Changelogs", footer: "© 2026 Ametium Development. All rights reserved.", btnText: "English", flag: "https://flagcdn.com/w20/us.png", log: `<span class="plus-group"><span class="plus">[+]</span> New module "SuperPearl"\n╚ Phase inside walls using pearls.</span>\n<span class="warn-group"><span class="warn">[!]</span> "AutoMine" Enhanced\n╚ New option added: Break Surrounds</span>\n<span class="warn-group"><span class="warn">[!]</span> "BetterTags" Enhanced\n╚ More accurate ping colors\n╚ Item scale error on 1.21.1 fixed</span>\n<span class="warn-group"><span class="warn">[!]</span> "DiscordRPC" Updated\n╚ Official links updated\n╚ Logo updated</span>\n<span class="warn-group"><span class="warn">[!]</span> "PlayerTP" enhanced\n╚ Teleport technology improved\n╚ New option: stop at target\n╚ New option: Ignore Friends\n╚ Configuration simplified</span>\n<span class="warn-group"><span class="warn">[!]</span> "InventorySync" Optimized\n╚ Items are sent to the correct slot.\n╚ New option added: "Packets per tick"</span>\n<span class="warn-group"><span class="warn">[!]</span> "SilentAttack" Enhanced\n╚ New option: Ignore Bots\n╚ "No Swing" option now functions correctly</span>\n<span class="warn-group"><span class="warn">[!]</span> "SuperAnchor" Enhanced\n╚ New options added:\n╚ Swing mode, Pause on Eat</span>\n<span class="warn-group"><span class="warn">[!]</span> "SuperCrystal" Fixed\n╚ Attack speed and technology improved\n╚ New options added:\n╚ Swing mode & Pause on Eat</span>` },
            es: { title: "Changelogs", footer: "© 2026 Ametium Development. Todos los derechos reservados.", btnText: "Español", flag: "https://flagcdn.com/w20/es.png", log: `<span class="plus-group"><span class="plus">[+]</span> Nuevo módulo "SuperPearl"\n╚ Atraviesa paredes usando perlas.</span>\n<span class="warn-group"><span class="warn">[!]</span> "AutoMine" Mejorado\n╚ Nueva opción añadida: Break Surrounds</span>\n<span class="warn-group"><span class="warn">[!]</span> "BetterTags" Mejorado\n╚ Colores de ping más precisos\n╚ Error de escala de items en la 1.21.1 corregido</span>\n<span class="warn-group"><span class="warn">[!]</span> "DiscordRPC" Actualizado\n╚ Enlaces oficiales actualizados\n╚ Logo actualizado</span>\n<span class="warn-group"><span class="warn">[!]</span> "PlayerTP" mejorado\n╚ Tecnología de teletransporte mejorada\n╚ Nueva opción: stop at target\n╚ Nueva opción: Ignore Friends\n╚ Configuración simplificada</span>\n<span class="warn-group"><span class="warn">[!]</span> "InventorySync" Optimizado\n╚ Los ítems se envían al slot correcto.\n╚ Nueva opción Añadida: "Packets per tick"</span>\n<span class="warn-group"><span class="warn">[!]</span> "SilentAttack" Mejorado\n╚ Nueva opción: Ignore Bots\n╚ Ahora la opción "No Swing" funciona correctamente</span>\n<span class="warn-group"><span class="warn">[!]</span> "SuperAnchor" Mejorado\n╚ Nuevas opciones añadidas:\n╚ Swing mode, Pause on Eat</span>\n<span class="warn-group"><span class="warn">[!]</span> "SuperCrystal" Arreglado\n╚ Velocidad y Tecnología de ataque mejoradas\n╚ Nuevas Opciones añadidas:\n╚ Swing mode & Pause on Eat</span>` }
        };
        function updateContent() {
            document.getElementById('page-title').innerText = translations[currentLang].title;
            document.getElementById('page-footer').innerText = translations[currentLang].footer;
            document.getElementById('lang-text').innerText = translations[currentLang].btnText;
            document.getElementById('lang-flag').src = translations[currentLang].flag;
            document.getElementById('log-3.3').innerHTML = translations[currentLang].log;
        }
        function toggleLanguage() { currentLang = (currentLang === 'es') ? 'en' : 'es'; updateContent(); }
        window.addEventListener('DOMContentLoaded', updateContent);
    </script>
</body>
</html>
