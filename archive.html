<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #111111;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 94px);
            overflow: hidden;
            z-index: 0;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 17, 17, 0.6);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .logo img {
            width: 30px;
            height: auto;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .archive-section {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 24px 60px 24px;
            flex: 1;
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .archive-header {
            margin-bottom: 54px;
        }

        .archive-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 14px;
            color: #ffffff;
            line-height: 1.1;
        }

        .archive-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            font-weight: 400;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: center;
        }

        .archive-link {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
            line-height: 1.2;
        }

        .archive-link:hover {
            color: #a0a0a0;
            transform: scale(1.03);
        }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            height: 94px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            background: #111111;
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: auto;
        }

        @media(max-width:900px) {
            .archive-title {
                font-size: 42px;
            }

            .archive-subtitle {
                font-size: 16px;
            }

            .archive-link {
                font-size: 32px;
            }

            .nav-container {
                flex-direction: column;
                gap: 14px;
                padding: 16px 24px;
            }

            .navbar {
                height: auto;
                position: relative;
            }

            .archive-section {
                padding-top: 40px;
            }

            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .bg-wrapper {
                height: calc(100% - 94px);
            }
        }
    </style>
</head>
<body>

<div class="bg-wrapper">
    <img src="image.png" alt="Hero Background" class="bg-image">
    <div class="hero-overlay"></div>
</div>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="ametium.png" alt="Ametium Logo">
            <span>Ametium Development</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="update.html">Updates</a>
            <a href="credits.html">Credits</a>
            <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
        </div>
    </div>
</nav>

<section class="archive-section">
    <div class="archive-header">
        <h1 class="archive-title">Version Archive</h1>
        <p class="archive-subtitle">Download Ametium older version builds.</p>
    </div>

    <div class="links-list">
        <a href="Ametium-Addon-3.3-1.21.11.jar" download class="archive-link">1.21.11</a>
        <a href="Ametium-Addon-3.3-1.21.8.jar" download class="archive-link">1.21.8</a>
        <a href="Ametium-Addon-3.3-1.21.1.jar" download class="archive-link">1.21.1</a>
    </div>
</section>

<div class="footer">© 2026 Ametium Development. All rights reserved.</div>

</body>
</html>
