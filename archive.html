<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            background: #111111;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(8px);
        }

        .hero-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 17, 0.6);
            z-index: 1;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .logo img {
            width: 30px;
            height: auto;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .archive-section {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 140px 40px 80px 40px;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .archive-header {
            text-align: center;
            margin-bottom: 64px;
        }

        .archive-title {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .archive-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 400;
        }

        .versions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .version-card {
            background: rgba(26, 26, 26, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .version-card:hover {
            transform: translateY(-4px);
            border-color: rgba(90, 0, 150, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .version-number {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .download-btn {
            width: 100%;
            padding: 14px 0;
            border-radius: 12px;
            background: #5a0096;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(90, 0, 150, 0.2);
        }

        .download-btn:hover {
            background: #6e00b8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(90, 0, 150, 0.4);
        }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            background: #111111;
            position: relative;
            z-index: 2;
        }

        @media(max-width:900px) {
            .versions-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .archive-section {
                padding: 120px 20px 60px 20px;
            }

            .archive-title {
                font-size: 36px;
            }

            .version-card {
                padding: 32px 24px;
            }

            .nav-container {
                flex-direction: column;
                gap: 12px;
                padding: 12px 24px;
            }

            .navbar {
                height: auto;
                padding: 8px 0;
            }

            .nav-links {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<img src="image.png" alt="Hero Background" class="bg-image">
<div class="hero-overlay"></div>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="ametium.png" alt="Ametium Logo">
            <span>Ametium Development</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="update.html">Updates</a>
            <a href="credits.html">Credits</a>
            <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
        </div>
    </div>
</nav>

<section class="archive-section">
    <div class="archive-header">
        <h1 class="archive-title">Version Archive</h1>
        <p class="archive-subtitle">Access previous deployment builds and stable releases.</p>
    </div>

    <div class="versions-grid">
        <div class="version-card">
            <div class="version-number">Minecraft 1.21.11</div>
            <a href="Ametium-Addon-3.3-1.21.11.jar" download class="download-btn">Download Release</a>
        </div>

        <div class="version-card">
            <div class="version-number">Minecraft 1.21.8</div>
            <a href="Ametium-Addon-3.3-1.21.8.jar" download class="download-btn">Download Release</a>
        </div>

        <div class="version-card">
            <div class="version-number">Minecraft 1.21.1</div>
            <a href="Ametium-Addon-3.3-1.21.1.jar" download class="download-btn">Download Release</a>
        </div>
    </div>
</section>

<div class="footer">© 2026 Ametium Development. All rights reserved.</div>

</body>
</html>
