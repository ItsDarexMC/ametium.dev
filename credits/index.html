<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Development</title>
    <link rel="icon" type="image/png" href="/ametium.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #111111; color: #e0e0e0; font-family: 'Poppins', sans-serif; overflow-x: hidden; }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: #1a1a1a; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 0 24px;
        }
        .nav-container { width: 100%; max-width: 100%; display: flex; align-items: center; position: relative; }
        .logo { display: flex; align-items: center; position: absolute; left: 0; }
        .logo img { width: 30px; height: auto; }
        .nav-links { display: flex; gap: 28px; margin: 0 auto; }
        .nav-links a { text-decoration: none; color: #a0a0a0; font-size: 13px; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: #ffffff; }

        .content-wrapper { padding: 100px 40px 40px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 24px; margin-bottom: 20px; color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: #161616; padding: 20px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .role { font-size: 11px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; display: inline-block; }
        .founder { background: rgba(144, 0, 255, 0.2); color: #c480ff; }
        .dev { background: rgba(0, 100, 255, 0.2); color: #4d8dff; }

        .social-links { margin-top: 15px; display: flex; gap: 12px; }
        .social-link { color: #fff; text-decoration: none; font-size: 18px; opacity: 0.7; transition: 0.2s; }
        .social-link:hover { opacity: 1; color: #fafafa; }

      @media(max-width:720px) {
            .nav-container {
                justify-content: center;
            }
            .logo {
                display: none;
            }
            .nav-links {
                margin: 0;
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .updates-section {
                padding: 100px 20px 40px 20px;
            }
            .updates-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="../ametium.png" alt="Ametium Logo">
        </div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../features">Features</a>
            <a href="../updates">Updates</a>
            <a href="../credits" style="color: #ffffff;">Credits</a>
            <a href="https://discord.gg/4Wbk2x7qXn">Discord</a>
        </div>
    </div>
</nav>

<div class="content-wrapper">
    <h2 class="section-title">Team</h2>
    <div class="grid">
        <div class="card">
            <span class="role founder">Founder</span>
            <h3>ItsDarexMC</h3>
            <p style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">Founder of Ametium Development</p>
            <div class="social-links">
                <a href="https://github.com/ItsDarexMC" class="social-link"><i class="fab fa-github"></i></a>
                <a href="https://tiktok.com/@ItsDarexMC" class="social-link"><i class="fab fa-tiktok"></i></a>
                <a href="https://youtube.com/@ItsDarexMC" class="social-link"><i class="fab fa-youtube"></i></a>
         </div>
    </div>

    <h2 class="section-title">Alliances</h2>
    <div class="grid">
        <div class="card">
            <h3 style="color: #FFD700;">Sunny <span style="color: #ffffff;">Development</span></h3>
            <p style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">Alliance with Ametium Development.</p>
            <div class="social-links">
                <a href="https://discord.gg/n3ffSY7wPb" class="social-link"><i class="fab fa-discord"></i></a>
            </div>
        </div>
        <div class="card">
            <h3 style="color: #a06430;">Vicoré <span style="color: #ffffff;">Development</span></h3>
            <p style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">Alliance with Ametium Development.</p>
            <div class="social-links">
                <a href="https://discord.gg/DTUbmUyCft" class="social-link"><i class="fab fa-discord"></i></a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
